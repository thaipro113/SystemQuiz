name: Quiz System CI/CD

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Backend .NET 8 ────────────────────────────────
  backend:
    name: Backend (ASP.NET Core 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SystemQuiz.sln

      - name: Build
        run: dotnet build SystemQuiz.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test SystemQuiz.Tests/SystemQuiz.Tests.csproj --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=QuizDb_Test;Trusted_Connection=false;TrustServerCertificate=true;"
          Jwt__Key: "TestSecretKeyForCIOnlyNotForProduction123456"
          Jwt__Issuer: "QuizAPI"
          Jwt__Audience: "QuizAPIUsers"

  # ── Job 2: Frontend React + Vite ────────────────────────
frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: quiz-frontend/package-lock.json

      - name: Install dependencies
        working-directory: quiz-frontend
        run: npm install

      - name: Lint với ESLint
        working-directory: quiz-frontend
        run: npm run lint -- --max-warnings=100

      - name: Run tests      
        working-directory: quiz-frontend
        run: npm test -- --run
        continue-on-error: true

      - name: Build production
        working-directory: quiz-frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8080' }}
  # ── Job 3: Docker Build ──────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: cp .env.example .env

      - name: Build backend Docker image
        run: |
          docker build \
            -t systemquiz-backend:${{ github.sha }} \
            -f SystemQuiz/Dockerfile \
            .

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:8080 \
            -t systemquiz-frontend:${{ github.sha }} \
            ./quiz-frontend

      - name: Start services với docker compose
        run: |
          docker compose up -d db backend
          echo "Waiting for services to start..."
          sleep 30

      - name: Smoke test - Health check
        run: |
          curl -f http://localhost:8080/api/health || exit 1
          echo "✅ Health check passed!"

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
